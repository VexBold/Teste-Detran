<style>
:root{--bg:#eef1f6;--fg:#15202b;--card:#fff;--mut:#5d6b7a;--ac:#2563eb;--ac2:#7c3aed;--ok:#16a34a;--er:#dc2626;--bd:#d6dce5;--gold:#d97706;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1320;--fg:#e8ecf4;--card:#182033;--mut:#9aa7bd;--ac:#6ea2ff;--ac2:#a78bfa;--ok:#4ade80;--er:#ff7b72;--bd:#2a3550;--gold:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1320;--fg:#e8ecf4;--card:#182033;--mut:#9aa7bd;--ac:#6ea2ff;--ac2:#a78bfa;--ok:#4ade80;--er:#ff7b72;--bd:#2a3550;--gold:#fbbf24;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1000px 420px at 50% -10%,color-mix(in srgb,var(--ac) 28%,transparent),transparent),var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:680px;margin:0 auto;padding:14px}
.m{color:var(--mut);font-size:.9rem}small{opacity:.85}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
.hero{text-align:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.hero h1{margin:.1em 0;font-size:1.6rem}.logo{font-size:3rem;animation:fl 2.5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit}
.stats{display:flex;gap:8px}.stats div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center;font-size:.8rem}.stats b{display:block;font-size:1.4rem}
button{display:block;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0;font:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.2)}button:active:not(:disabled){transform:scale(.97)}
button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;text-align:center;font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
.sel{border:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 15%,var(--card))}
.o{display:flex;gap:10px;align-items:center}.o i{font-style:normal;font-weight:700;width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--bd)}
.o.ok:disabled,.o.bad:disabled{opacity:1}
.o.ok{background:var(--ok);color:#fff;border-color:var(--ok);animation:pop .4s}
.o.bad{background:var(--er);color:#fff;border-color:var(--er);animation:sk .4s}
@keyframes pop{50%{transform:scale(1.05)}}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hud{display:flex;justify-content:space-between;font-weight:700;margin-top:34px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar b{display:block;height:100%;background:var(--ac);transition:width .3s}
.tm b{background:var(--ok);transition:none}.tm b.lo{background:var(--er)}
.chip{font-size:.75rem;background:var(--bd);padding:2px 8px;border-radius:99px}
h2{font-size:1.1rem;margin:.5em 0 0}
.gok{border-left:5px solid var(--ok)}.gbad{border-left:5px solid var(--er)}
.exp{font-size:.9rem;color:var(--mut);margin-top:6px}
.big{font-size:2.4rem;font-weight:800;text-align:center}.stars{font-size:2.2rem;text-align:center;animation:pop .8s}
.pass{color:var(--ok)}.fail{color:var(--er)}
.sb{display:grid;grid-template-columns:1fr auto;gap:0 8px;font-size:.9rem}.sb .bar{grid-column:1/3}
.cert{text-align:center;border:4px double var(--gold);border-radius:14px;padding:16px;margin:10px 0;background:var(--card)}.cert h2{font-size:1.5rem;color:var(--gold)}
details.card{border-left:5px solid var(--er)}summary{cursor:pointer}
.mu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;width:auto;padding:6px 10px;z-index:5;margin:0}
.row{display:flex;gap:8px}.row button{text-align:center}.dots{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.dots i{font-style:normal;font-size:.75rem;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--bd);border-radius:7px;cursor:pointer;background:var(--card)}.dots i.d{background:var(--ac);color:#fff;border-color:var(--ac)}.dots i.c{outline:2px solid var(--fg)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
html{-webkit-text-size-adjust:100%}button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}@media(min-width:900px){#app{max-width:760px;padding-top:24px}}

<script>
const S={L:"Legislação de Trânsito",D:"Direção Defensiva",P:"Primeiros Socorros",M:"Meio Ambiente e Cidadania"};
const R={L:"Releia o CTB: velocidades (art. 61), pontuação (art. 259), preferência (art. 29) e habilitação (arts. 143 a 148).",D:"Revise o Manual de Direção Defensiva: distâncias, condições adversas e fatores de risco.",P:"Revise o socorro no local: sinalizar, acionar o socorro e não mover a vítima sem necessidade.",M:"Revise poluentes veiculares, descarte correto de resíduos e convivência no trânsito."};
/* [enunciado, alternativas (a correta é sempre a primeira; a ordem é embaralhada na prova), explicação] */
const D=[
["Em vias locais sem sinalização regulamentadora, a velocidade máxima é de:",["30 km/h","20 km/h","40 km/h","50 km/h"],"Via local: 30 km/h (coletora 40, arterial 60, trânsito rápido 80). As demais não são velocidades-padrão de via local. Base: CTB art. 61, §1º."],
["A validade da CNH, para condutor com menos de 50 anos, é de:",["10 anos","5 anos","8 anos","12 anos"],"Menores de 50 anos: 10 anos; de 50 a 69: 5 anos; 70 ou mais: 3 anos. Base: CTB art. 147, §2º."],
["Cada infração de natureza gravíssima gera quantos pontos na CNH?",["7 pontos","3 pontos","4 pontos","5 pontos"],"Leve 3, média 4, grave 5, gravíssima 7. Base: CTB art. 259."],
["Quem NÃO cometeu infração gravíssima nos últimos 12 meses tem o direito de dirigir suspenso ao atingir:",["40 pontos","20 pontos","30 pontos","50 pontos"],"Sem gravíssima: 40 pontos; com uma gravíssima: 30; com duas ou mais: 20. Não existe limite de 50. Base: CTB art. 261, §1º."],
["Dirigir sob influência de álcool é infração:",["Gravíssima, multa multiplicada por 10 e suspensão do direito de dirigir por 12 meses","Grave, com multa e apreensão do veículo","Média, apenas com multa","Gravíssima, apenas com advertência por escrito"],"É infração gravíssima com multa x10, suspensão de 12 meses e retenção do veículo. Não é grave, média nem só advertência. Base: CTB art. 165."],
["É proibido estacionar a menos de quantos metros do bordo do alinhamento da via transversal?",["5 metros","3 metros","8 metros","10 metros"],"A distância proibida é de 5 metros. As outras medidas não constam da regra. Base: CTB art. 181."],
["Sobre o cinto de segurança, é correto afirmar que:",["É obrigatório para condutor e passageiros em todas as vias do território nacional","É obrigatório apenas em rodovias","É obrigatório só para o condutor em área urbana","Passageiros do banco traseiro são dispensados em curtas distâncias"],"O uso é obrigatório para todos os ocupantes, em qualquer via, sem exceção por distância. Base: CTB art. 65."],
["Crianças com menos de 10 anos devem ser transportadas:",["No banco traseiro, em dispositivo de retenção adequado à idade, peso e altura","No banco dianteiro, com cinto afivelado","Em qualquer banco, se acompanhadas de adulto","No colo de um adulto, no banco traseiro"],"O lugar é o banco traseiro, com dispositivo adequado. Banco dianteiro e colo são proibidos. Base: CTB art. 64."],
["Em cruzamento não sinalizado, a preferência é do veículo que:",["Vier pela direita do condutor","Vier pela esquerda do condutor","Estiver em maior velocidade","For de maior porte"],"Sem sinalização vale a regra da direita. Velocidade e porte não dão preferência. Base: CTB art. 29, III."],
["A ultrapassagem pela direita só é permitida quando:",["O veículo da frente indicar que vai entrar à esquerda","A via for de mão dupla","O condutor estiver com pressa","O veículo da frente estiver em baixa velocidade"],"Só se o da frente sinalizou conversão à esquerda. Mão dupla, pressa ou lentidão não autorizam. Base: CTB art. 29, X."],
["Ao se aproximar de faixa de pedestres com pessoa atravessando, o condutor deve:",["Parar o veículo e aguardar a conclusão da travessia","Reduzir e buzinar","Acelerar para passar antes","Passar pela esquerda do pedestre"],"O pedestre na faixa tem prioridade; o condutor deve parar. Buzinar, acelerar ou contornar é infração. Base: CTB arts. 70 e 214."],
["O uso da buzina é permitido:",["Em toque breve para evitar acidente, ou fora de área urbana para advertir sobre ultrapassagem","Para chamar pessoas na calçada","Para apressar o veículo da frente","Em qualquer situação, em toque breve"],"A buzina só serve para evitar acidente ou, fora das áreas urbanas, advertir ultrapassagem. Base: CTB art. 41."],
["Em rodovia de pista dupla, sem sinalização, a velocidade máxima para automóveis é de:",["110 km/h","80 km/h","100 km/h","120 km/h"],"Rodovias de pista dupla: 110 km/h para automóveis (pista simples: 100). Não existe 120 como padrão. Base: CTB art. 61, §1º, II."],
["Havendo conflito entre sinais de trânsito, prevalece:",["A ordem do agente de trânsito","O semáforo sobre o agente","A placa sobre o semáforo","A sinalização horizontal sobre o semáforo"],"Ordem de prevalência: agente, semáforo, placas, marcas viárias, gestos e apitos. Base: CTB art. 89."],
["A categoria B autoriza conduzir veículos:",["De PBT até 3.500 kg e até 8 lugares, exclusive o motorista","De até 6.000 kg e até 10 lugares","De carga, de qualquer peso, com 4 lugares","De passageiros com até 20 lugares"],"Categoria B: PBT até 3.500 kg e lotação até 8 lugares, fora o condutor. Veículos maiores exigem C, D ou E. Base: CTB art. 143."],
["A Permissão para Dirigir vira CNH definitiva se, após 1 ano, o condutor:",["Não cometeu infração grave ou gravíssima nem é reincidente em média","Não cometeu nenhuma infração, nem leve","Fez curso de reciclagem","Acumulou no máximo 10 pontos"],"A conversão exige ausência de infração grave ou gravíssima e de reincidência em média. Infração leve não impede. Base: CTB art. 148, §3º."],
["Ao ser alcançado por veículo de emergência com sirene e luz vermelha intermitente, o condutor deve:",["Deslocar-se para a direita e parar, se necessário","Aumentar a velocidade","Manter faixa e velocidade","Parar imediatamente no meio da via"],"Deve-se liberar a passagem pela direita, parando se preciso, sem bloquear a via. Base: CTB art. 29, VII."],
["Transitar acima da velocidade máxima em mais de 20% até 50% é infração:",["Grave","Média","Gravíssima","Leve"],"Até 20%: média; de 20% a 50%: grave; acima de 50%: gravíssima. Base: CTB art. 218."],
["Em caso de aquaplanagem, o condutor deve:",["Segurar firme o volante, tirar o pé do acelerador e evitar frear bruscamente","Frear com força e esterçar","Acelerar para recuperar aderência","Engatar marcha mais baixa bruscamente"],"Freada ou esterçamento brusco faz perder o controle; deixe o carro desacelerar sozinho. Base: Manual de Direção Defensiva."],
["A distância de parada de um veículo corresponde a:",["Distância de reação + distância de frenagem","Distância de frenagem menos distância de reação","Apenas a distância de frenagem","Distância de seguimento + distância lateral"],"Parar exige o tempo de reação do condutor mais a frenagem. Base: Manual de Direção Defensiva."],
["Em neblina densa, o condutor deve:",["Usar farol baixo e, se necessário, o de neblina","Usar farol alto","Manter apenas luzes de posição","Acionar pisca-alerta e seguir em velocidade normal"],"Farol alto reflete na neblina e ofusca; só posição não basta; velocidade normal é perigosa. Base: Manual de Direção Defensiva."],
["Direção defensiva é:",["Dirigir de modo a evitar acidentes, apesar de ações incorretas de outros e condições adversas","Dirigir sempre em baixa velocidade","Dirigir apenas em vias conhecidas","Usar o veículo só em horários de menor movimento"],"É uma postura preventiva diante de riscos e erros alheios, não apenas lentidão ou rotas fixas. Base: Manual de Direção Defensiva."],
["O fator que mais contribui para os acidentes de trânsito é:",["O fator humano","As condições da via","As condições climáticas","Defeitos mecânicos"],"A maioria dos acidentes decorre de falhas humanas: imprudência, distração, álcool, sono. Base: Manual de Direção Defensiva."],
["O condutor que sente sono durante a viagem deve:",["Parar em local seguro e descansar","Abrir os vidros e aumentar o som","Tomar café e continuar","Reduzir a velocidade e seguir"],"Só o descanso resolve o sono; as demais medidas têm efeito curto e enganoso. Base: Manual de Direção Defensiva."],
["Ao chegar a um local de acidente, a primeira atitude deve ser:",["Sinalizar o local e acionar o socorro especializado","Retirar todas as vítimas dos veículos","Oferecer água às vítimas","Remover os veículos para liberar a via"],"Primeiro evitar novos acidentes e chamar socorro. Mover vítimas, dar água ou remover veículos pode agravar. Base: CTB art. 304 e noções de primeiros socorros."],
["Em caso de hemorragia externa, deve-se:",["Fazer compressão direta no local com pano limpo","Aplicar pó de café no ferimento","Lavar com álcool e deixar descoberto","Retirar o objeto cravado"],"A compressão estanca o sangramento. Substâncias caseiras infeccionam; objeto cravado deve permanecer. Base: noções de primeiros socorros."],
["Motociclista inconsciente caído, com capacete, deve:",["Permanecer com o capacete, salvo necessidade extrema, até o socorro chegar","Ter o capacete retirado rapidamente","Ser sentado e receber água","Ser levado ao hospital em carro particular"],"Retirar o capacete ou movê-lo pode agravar lesão na coluna. Base: noções de primeiros socorros."],
["O gás emitido pelos veículos que se liga à hemoglobina e impede o transporte de oxigênio é o:",["Monóxido de carbono","Dióxido de carbono","Oxigênio","Nitrogênio"],"O CO tem alta afinidade com a hemoglobina e é tóxico, sem cheiro. Base: conteúdo de Meio Ambiente e Cidadania."],
["O destino correto do óleo lubrificante usado é:",["Pontos de coleta ou estabelecimentos autorizados para rerrefino","O ralo ou a rede de esgoto","Terrenos baldios","Queima a céu aberto"],"O óleo usado é resíduo perigoso e deve ir para coleta e rerrefino. Base: Resolução CONAMA 362/2005."],
["Diante de um idoso atravessando a via lentamente, o condutor cidadão deve:",["Aguardar com paciência a conclusão da travessia","Buzinar para ele acelerar","Passar rente para incentivar","Reduzir e passar sem parar"],"O pedestre é o elo mais frágil e o veículo maior responde pela segurança dos menores. Base: CTB art. 29, §2º, e art. 70."]
];
const SB=D.map((d,i)=>i<18?"L":i<24?"D":i<27?"P":"M"),LVL=[1,1,1,3,2,2,1,1,1,2,1,2,2,2,2,3,1,3,2,1,1,1,1,1,1,1,2,2,1,1];
const Q=(s,l,t,o,e)=>{D.push([t,o,e]);SB.push(s);LVL.push(l)};
const G=(s,l,rows,f,e,x=[])=>rows.forEach((r,i)=>{const ws=[...new Set([...rows.map(y=>y[1]),...x])].filter(a=>a!=r[1]);Q(s,l,f(r),[r[1],...[0,1,2].map(k=>ws[(i+k)%ws.length])],e)});
function pool(k){const W={L:18,D:6,P:3,M:3},ok={f:l=>l<3,d:l=>l>1}[k]||(l=>1);let r=[];for(const s in W){const all=D.map((d,i)=>i).filter(i=>SB[i]==s),a=sh(all.filter(i=>ok(LVL[i]))),b=sh(all.filter(i=>!a.includes(i)));r.push(...a.concat(b).slice(0,W[s]))}return r}
Q("L",2,"O condutor NÃO pode ultrapassar, em via de duplo sentido e pista única, nos trechos de:",["Curvas e aclives sem visibilidade suficiente","Retas com boa visibilidade e linha tracejada","Trechos com acostamento largo","Vias com velocidade abaixo de 60 km/h"],"Também é proibido em passagens de nível, pontes, viadutos e travessias de pedestres, salvo sinalização que permita. Base: CTB art. 32.");
Q("L",1,"O sinal luminoso de direção (seta) deve ser acionado:",["Com antecedência, antes de mudar de faixa ou de direção","Somente em rodovias","Apenas à noite","Somente ao virar à direita"],"A seta indica a manobra com antecedência, em qualquer via e horário. Base: CTB art. 35.");
Q("L",2,"Dirigir sem possuir CNH, PPD ou ACC é infração:",["Gravíssima, com multa multiplicada por três","Grave, com multa simples","Média, apenas com advertência","Leve, com simples notificação"],"É infração gravíssima com multa x3, podendo ser também crime quando há perigo de dano. Base: CTB arts. 162 e 309.");
Q("L",1,"A idade mínima para obter a habilitação na categoria B é de:",["18 anos completos","16 anos","17 anos","21 anos"],"Exige-se ser penalmente imputável, ou seja, ter 18 anos completos. Base: CTB art. 140, I.");
Q("L",2,"Ao se aproximar de uma rotatória, tem preferência de passagem o veículo:",["Que já está circulando por ela","Que está entrando nela","De maior velocidade","Que vem pela direita, sempre"],"Quem circula na rotatória tem preferência sobre quem vai entrar. Base: CTB art. 29, III.");
Q("L",2,"O pisca-alerta deve ser usado:",["Em imobilizações ou situações de emergência","Para agradecer outro condutor","Para avisar que vai ultrapassar","Sempre que reduzir a velocidade"],"O uso é restrito a imobilizações, emergências ou quando a sinalização determinar. Base: CTB art. 40, V.");
Q("L",3,"Recusar-se a fazer o teste do bafômetro ou exame clínico é:",["Infração gravíssima, com multa x10 e suspensão do direito de dirigir por 12 meses","Direito do condutor, sem qualquer penalidade","Infração média, com multa simples","Motivo apenas de advertência verbal"],"A recusa tem as mesmas penalidades administrativas de dirigir sob influência de álcool. Base: CTB art. 165-A.");
Q("L",2,"A linha dupla amarela contínua no centro da pista indica:",["Proibição de ultrapassagem e de transposição nos dois sentidos","Ultrapassagem livre nos dois sentidos","Ultrapassagem permitida apenas para motos","Faixa exclusiva de ônibus"],"Ela separa fluxos opostos e proíbe cruzá-la ou ultrapassar. Base: CTB Anexo II e Manual Brasileiro de Sinalização (CONTRAN).");
Q("L",2,"A linha branca contínua separando faixas de mesmo sentido indica:",["Proibição de mudar de faixa","Ultrapassagem livre","Faixa exclusiva de ônibus","Local de parada permitida"],"Marca branca contínua entre faixas do mesmo sentido proíbe a troca de faixa. Base: Manual Brasileiro de Sinalização (CONTRAN).");
Q("L",3,"Para configurar o CRIME de embriaguez ao volante, a concentração de álcool no ar alveolar deve ser de, no mínimo:",["0,3 mg/L","0,1 mg/L","0,05 mg/L","0,6 mg/L"],"O crime exige 0,3 mg/L de ar alveolar (ou 6 dg/L de sangue); a infração administrativa vale para qualquer concentração. Base: CTB arts. 306 e 165.");
Q("L",1,"A luz amarela do semáforo significa:",["Atenção: parar, salvo se a parada causar perigo","Acelerar para passar","Seguir com cuidado, sempre","Parar apenas se houver pedestre"],"Amarelo é sinal de atenção e antecede o vermelho. Base: CTB Anexo II (sinalização semafórica).");
Q("L",2,"Quanto à responsabilidade pela segurança no trânsito, é correto:",["Veículos maiores respondem pelos menores e os motorizados pelos não motorizados","Os menores respondem pelos maiores","Os não motorizados respondem pelos motorizados","Cada condutor responde apenas por si"],"Todos respondem juntos pela incolumidade dos pedestres. Base: CTB art. 29, §2º.");
Q("L",2,"Nas rodovias, durante o dia, o condutor deve manter:",["Faróis acesos em luz baixa","Faróis apagados","Apenas as lanternas","Farol alto"],"A luz baixa deve ficar acesa nas rodovias, de dia e de noite. Base: CTB art. 40, I.");
Q("D",2,"A distância segura de seguimento entre veículos depende de:",["Velocidade, condições da via, do veículo e do clima","Somente da cor do veículo","Somente do tipo de combustível","Apenas do horário"],"Quanto maior a velocidade e piores as condições, maior deve ser a distância. Base: Manual de Direção Defensiva.");
Q("D",2,"Se um pneu dianteiro estourar em movimento, o condutor deve:",["Segurar firme o volante, aliviar o acelerador e parar no acostamento sem frear bruscamente","Frear com força","Acelerar para estabilizar","Girar o volante bruscamente"],"Freada ou esterçamento brusco pode causar rodopio ou capotamento. Base: Manual de Direção Defensiva.");
Q("D",2,"O chamado efeito túnel em alta velocidade significa:",["Redução do campo de visão lateral conforme a velocidade aumenta","Ampliação do campo de visão","Melhora da percepção de distância","Aumento da aderência do pneu"],"Quanto maior a velocidade, mais estreito fica o campo visual. Base: Manual de Direção Defensiva.");
Q("D",2,"Em descida longa, o procedimento correto é:",["Usar marcha reduzida e o freio-motor","Engatar ponto morto para economizar","Frear continuamente","Desligar o motor"],"Ponto morto tira o freio-motor e superaquece os freios. Base: Manual de Direção Defensiva.");
Q("D",1,"Com chuva forte, a distância de seguimento deve ser:",["Aumentada","Reduzida","A mesma de sempre","Zerada"],"Pista molhada alonga a distância de frenagem. Base: Manual de Direção Defensiva.");

G("L",2,[["da placa R-1 (PARE)","formato octogonal e fundo vermelho"],["da placa R-2 (DÊ A PREFERÊNCIA)","formato triangular com vértice para baixo"],["das placas de advertência","formato quadrado (losango) e fundo amarelo"],["das placas de regulamentação","formato circular, fundo branco e borda vermelha"],["das placas de atrativos turísticos","fundo marrom"],["das placas de serviços auxiliares","fundo azul"]],r=>`Qual é o padrão visual ${r[0]}?`,"A forma e a cor identificam o tipo de placa. Base: CTB Anexo II e Manual Brasileiro de Sinalização (CONTRAN).");
G("P",1,[["do SAMU","192"],["do Corpo de Bombeiros","193"],["da Polícia Militar","190"],["da Polícia Rodoviária Federal","191"]],r=>`O número de emergência ${r[0]} é:`,"190 Polícia Militar, 191 PRF, 192 SAMU e 193 Bombeiros.");
const A=document.getElementById("app"),$=s=>document.querySelector(s);
const LV={f:{n:"Fácil",e:"🟢",t:0,h:5,l:0,d:"Sem tempo · 5 dicas · questões básicas e médias"},n:{n:"Normal",e:"🟡",t:45,h:3,l:0,d:"45s por questão · 3 dicas · todas as questões"},d:{n:"Difícil",e:"🔴",t:25,h:0,l:3,d:"25s · sem dicas · 3 vidas · só questões difíceis e pegadinhas"}};
const T=["Aprendiz","Candidato","Condutor","Motorista Defensivo","Mestre do Trânsito"];
const sub=i=>SB[i];
const esc=s=>String(s).replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";");
function sv(){try{return JSON.parse(localStorage.getItem("dt_err")||"[]")}catch(e){return[]}}
function svw(a){try{localStorage.setItem("dt_err",JSON.stringify(a))}catch(e){}}
let P={name:"",xp:0,best:0,m:[]};try{P={...P,...JSON.parse(localStorage.getItem("dt_p")||"{}")}}catch(e){}
function svP(){try{localStorage.setItem("dt_p",JSON.stringify(P))}catch(e){}}
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
let st,tm,sel="n",mute=false,AC;
const SN={ok:[[523,0],[659,.1],[784,.2]],bad:[[220,0],[165,.15]],win:[[523,0],[659,.12],[784,.24],[1047,.36]],lose:[[392,0],[294,.2],[196,.4]],clk:[[600,0]]};
function snd(t){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();SN[t].forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+d;o.type=t=="bad"||t=="lose"?"sawtooth":"triangle";o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.16,s);g.gain.exponentialRampToValueAtTime(.001,s+.25);o.start(s);o.stop(s+.26)})}catch(e){}}
function boom(n){const c=$("#fx"),g=c.getContext("2d"),k=["#f59e0b","#22c55e","#3b82f6","#ec4899","#a78bfa"];c.width=innerWidth;c.height=innerHeight;const p=[...Array(n)].map(()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*12,vy:-Math.random()*10-3,s:4+Math.random()*5,c:k[Math.random()*5|0],l:70}));(function f(){g.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.35;q.l--;g.fillStyle=q.c;g.fillRect(q.x,q.y,q.s,q.s)});if(p[0].l>0)requestAnimationFrame(f);else g.clearRect(0,0,c.width,c.height)})()}
function home(){clearInterval(tm);const e=sv(),lvl=Math.floor(P.xp/1000)+1;
A.innerHTML=`<div class="card hero"><div class="logo">🚦</div><h1>Instituto Via Segura</h1><div>Centro de Formação de Condutores<br><small>Banco com ${D.length} questões · prova de 30 · aprovação com 21 acertos</small></div></div>
<div class="card"><label class="m">Nome do candidato</label><input value="${esc(P.name)}" placeholder="Digite seu nome" oninput="P.name=this.value;svP()"></div>
<div class="stats"><div><b>${lvl}</b>Nível<br>${T[Math.min(4,Math.floor((lvl-1)/2))]}</div><div><b>${P.xp}</b>XP total</div><div><b>${P.best}%</b>Melhor nota</div></div>
${P.m.length?`<div class="card">🏅 ${P.m.join(" · ")}</div>`:""}
<div class="m">Escolha a dificuldade</div>${Object.keys(LV).map(k=>`<button class="${k==sel?"sel":""}" onclick="sel='${k}';snd('clk');home()">${LV[k].e} <b>${LV[k].n}</b><br><small>${LV[k].d}</small></button>`).join("")}
<button class="p" onclick="exam()">📝 PROVA FINAL · modo prova real<br><small>30 questões sorteadas · 40 min · sem dicas · sem feedback até o fim · mínimo 21 acertos</small></button><button onclick="start(pool(sel))">▶ Treino com dificuldade escolhida</button><button onclick="start(sv())" ${e.length?"":"disabled"}>🔁 Reforço: refazer meus ${e.length} erros</button>${ST()?"":`<button id="ib" style="display:${ip?"block":"none"}" onclick="ip.prompt();this.style.display='none'">📲 Instalar app</button><p class="m">📲 iPhone/iPad: Safari → Compartilhar → Adicionar à Tela de Início. Android: menu ⋮ → Instalar app.</p>`}<p class="m">Prova com questões originais no estilo do DETRAN, baseadas no CTB. Simulado sem valor oficial.</p>`}
function start(ids){if(!ids.length)return;snd("clk");const L=LV[sel];st={lv:sel,c:0,score:0,streak:0,ms:0,used:0,hints:L.h,lives:L.l,q:sh(ids).map(i=>({i,o:sh(D[i][1].map((t,k)=>({t,k}))),a:null,x:[]}))};show()}
function show(){const q=st.q[st.c],L=LV[st.lv],n=st.q.length,d=q.a!=null,c=q.o.findIndex(o=>!o.k),last=st.c==n-1||(L.l&&st.lives<=0);
A.innerHTML=`<div class="hud"><span>${L.l?("❤️".repeat(Math.max(st.lives,0))||"💀"):L.e+" "+L.n}</span><span>🔥 ${st.streak}</span><span>⭐ ${st.score}</span><span>${st.c+1}/${n}</span></div><div class="bar"><b style="width:${(st.c+(d?1:0))/n*100}%"></b></div>${L.t?'<div class="bar tm"><b id="tb" style="width:100%"></b></div>':""}<div class="card"><span class="chip">${S[sub(q.i)]}</span><h2>${D[q.i][0]}</h2></div>${q.o.map((o,k)=>`<button class="o ${d&&k==c?"ok":""} ${d&&k==q.a&&k!=c?"bad":""}" ${d||q.x.includes(k)?"disabled":""} onclick="pick(${k})"><i>${"ABCD"[k]}</i>${o.t}</button>`).join("")}`+(d?`<div class="card ${q.a==c?"gok":"gbad"}"><b>${q.a==c?"✅ Correto!":q.a<0?"⏰ Tempo esgotado!":"❌ Errou."}</b><div class="exp">${D[q.i][2]}</div></div><button class="p" onclick="next()">${last?"Ver resultado":"Continuar →"}</button>`:`<button onclick="hint()" ${st.hints&&!q.x.length?"":"disabled"}>💡 Dica (${st.hints})</button>`);
clearInterval(tm);if(!d&&L.t){q.t0=q.t0||Date.now();tm=setInterval(()=>{const r=1-(Date.now()-q.t0)/1000/L.t,b=$("#tb");if(b){b.style.width=Math.max(r,0)*100+"%";b.className=r<.3?"lo":""}if(r<=0){clearInterval(tm);pick(-1)}},100)}}
function hint(){const q=st.q[st.c];if(q.a!=null||!st.hints||q.x.length)return;st.hints--;st.used++;q.x=sh(q.o.map((o,k)=>k).filter(k=>q.o[k].k)).slice(0,2);snd("clk");show()}
function pick(k){const q=st.q[st.c],L=LV[st.lv];if(q.a!=null)return;clearInterval(tm);q.a=k;
if(k>=0&&q.o[k].k==0){const left=L.t?Math.max(0,1-(Date.now()-q.t0)/1000/L.t):0;st.streak++;st.ms=Math.max(st.ms,st.streak);st.score+=100+Math.round(left*50)+Math.min(st.streak,10)*10;snd("ok");boom(st.streak>=3?100:45)}else{st.streak=0;if(L.l)st.lives--;snd("bad");if(navigator.vibrate)navigator.vibrate(120)}
show()}
function next(){snd("clk");if(st.c>=st.q.length-1||(LV[st.lv].l&&st.lives<=0))return end();st.c++;show()}
function end(){clearInterval(tm);const hit=x=>x.a>=0&&x.o[x.a].k==0,Q=st.q.filter(x=>x.a!=null),n=st.q.length,ok=Q.filter(hit).length,p=Math.round(ok/n*100),dead=LV[st.lv].l&&st.lives<=0,full=n==30,pass=full&&p>=70&&!dead;
let e=sv();Q.forEach(x=>{e=e.filter(i=>i!==x.i);if(!hit(x))e.push(x.i)});svw(e);
const m=[];if(st.ms>=5)m.push("🔥 Sequência 5");if(ok==n)m.push("🎯 Perfeito");if(pass&&!st.used)m.push("🧠 Sem dicas");if(pass&&st.lv=="d")m.push("💪 Difícil");
P.xp+=st.score;P.best=Math.max(P.best,p);P.m=[...new Set([...P.m,...m])];svP();
const bad=Q.filter(x=>!hit(x)),ws=[...new Set(bad.map(x=>sub(x.i)))],stars=dead?0:p>=95?3:p>=85?2:p>=70?1:0;
snd(pass?"win":"lose");if(pass)boom(160);
A.innerHTML=`<div class="card"><div class="big ${pass?"pass":"fail"}">${dead?"💀 FIM DE JOGO":full?(pass?"APROVADO ✅":"REPROVADO ❌"):p+"%"}</div><div class="stars">${"⭐".repeat(stars)||"—"}</div><p style="text-align:center">${ok}/${n} acertos · ${p}% · +${st.score} XP${full?"<br><small>Mínimo: 21 acertos (70%)</small>":""}</p>${m.length?`<p style="text-align:center">🏅 ${m.join(" · ")}</p>`:""}</div>
${pass?`<div class="cert"><small>CERTIFICADO DO SIMULADO · SEM VALOR OFICIAL</small><h2>${esc(P.name||"Candidato")}</h2>aprovado(a) com ${ok}/30 acertos no nível ${LV[st.lv].n}<br><small>Instituto Via Segura · ${new Date().toLocaleDateString("pt-BR")}</small></div>`:""}
<div class="card"><b>Desempenho por matéria</b>${Object.keys(S).map(s=>{const t=Q.filter(x=>sub(x.i)==s),c=t.filter(hit).length;return t.length?`<div class="sb"><span>${S[s]}</span><b>${c}/${t.length}</b><div class="bar"><b style="width:${c/t.length*100}%"></b></div></div>`:""}).join("")}</div>
${ws.length?`<div class="card"><b>📚 Recomendação de estudo</b>${ws.map(s=>`<div class="exp"><b>${S[s]} (${bad.filter(x=>sub(x.i)==s).length} erro(s)):</b> ${R[s]}</div>`).join("")}</div>`:""}
${bad.map(x=>`<details class="card"><summary>${D[x.i][0]}</summary><div class="exp">Correta: <b>${D[x.i][1][0]}</b><br>${D[x.i][2]}</div></details>`).join("")}
<button class="p" onclick="start(sv())" ${e.length?"":"disabled"}>🔁 Reforço dos erros (${e.length})</button><button onclick="start(pool(sel))">▶ Nova prova</button><button onclick="home()">🏠 Início</button>`;window.scrollTo(0,0)}
const tl=()=>{const r=Math.max(0,st.dur-Math.floor((Date.now()-st.t0)/1000));return Math.floor(r/60)+":"+String(r%60).padStart(2,"0")};
function exam(){snd("clk");LV.x={n:"Prova Final",e:"📝",t:0,h:0,l:0,d:""};st={ex:1,lv:"x",c:0,score:0,streak:0,ms:0,used:0,hints:0,lives:0,t0:Date.now(),dur:2400,q:sh(pool("x")).map(i=>({i,o:sh(D[i][1].map((t,k)=>({t,k}))),a:null,x:[]}))};clearInterval(tm);tm=setInterval(()=>{const b=$("#tm");if(b)b.textContent=tl();if(Date.now()-st.t0>=st.dur*1000)xfin(1)},500);xshow()}
function xshow(){const q=st.q[st.c],done=st.q.filter(x=>x.a!=null).length;
A.innerHTML=`<div class="hud"><span>📝 PROVA FINAL</span><span>⏱ <b id="tm">${tl()}</b></span><span>${done}/30</span></div><div class="bar"><b style="width:${done/30*100}%"></b></div><div class="dots">${st.q.map((x,k)=>`<i class="${x.a!=null?"d":""} ${k==st.c?"c":""}" onclick="st.c=${k};xshow()">${k+1}</i>`).join("")}</div><div class="card"><span class="chip">Questão ${st.c+1}</span><h2>${D[q.i][0]}</h2></div>${q.o.map((o,k)=>`<button class="o ${q.a===k?"sel":""}" onclick="xpick(${k})"><i>${"ABCD"[k]}</i>${o.t}</button>`).join("")}<div class="row"><button onclick="xgo(-1)">← Anterior</button><button onclick="xgo(1)">Próxima →</button></div><button class="p" onclick="xfin()">Finalizar prova</button><div id="msg" class="m"></div>`}

function xgo(d){st.c=Math.max(0,Math.min(29,st.c+d));xshow()}

st.q.forEach(x=>{if(x.a==null)x.a=-1});st.score=st.q.filter(x=>x.o[x.a]&&x.o[x.a].k==0).length*150;end()}
const ST=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone;

home();
if("serviceWorker"in navigator&&/^https?:/.test(location.protocol))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
